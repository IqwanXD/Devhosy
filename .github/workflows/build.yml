name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk membuat Release saat push tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK sudah terpasang di runner ubuntu-latest.
      # Gradle 8.13 cocok dengan Android Gradle Plugin 8.13.1 di build.gradle.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Devhosy-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keystore dikirim sebagai base64 di secret KEYSTORE_BASE64, lalu didekode ke file sementara.
      # Pull request dari fork tidak punya akses ke secret, jadi langkah ini dilewati di sana.
      - name: Siapkan keystore dari secret
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verifikasi tanda tangan APK
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "Signer #1" \
            || { echo "::error::APK release belum ditandatangani"; exit 1; }

      - name: Hapus keystore sementara
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Devhosy-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Buat Release dari tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
